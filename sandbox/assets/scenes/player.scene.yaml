version: 3
name: Player
objects:
  - id: player
    name: Player
    transform: {type: Transform2D, scaleX: 8, scaleY: 8}
    components:
      - type: SpriteRenderer
        texture: {root: game, path: sprite.png}
      - {type: Player, speed: 240}
    children:
      - id: player-hitbox
        name: Player hitbox
        transform: {type: Transform2D}
        components:
          - {type: Collider2D, height: 16, width: 16}
      - id: player-body
        name: Player body
        components:
          - {type: Body2D, velocityX: 0, velocityY: 0}
