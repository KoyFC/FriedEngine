version: 3
name: Sandbox HTML
objects:
  - id: sandbox-html
    name: Sandbox HTML
    children:
      - id: menu
        name: Menu
        transform: {type: RectTransform}
        components:
          - {type: UIDocument}
          - {type: MainMenu}
      - id: hud
        name: HUD
        transform: {type: RectTransform}
        components:
          - type: UIDocument
            document: {root: game, path: ui/hud.html}
            priority: 1
            theme: {root: game, path: ui/theme.css}
