version: 3
name: Sandbox 3D
camera: camera
objects:
  - id: sandbox-3d-root
    name: Sandbox 3D
    children:
      - id: camera
        name: Camera
        transform: {type: Transform3D}
        components:
          - {type: Camera3D}
        children:
          - id: free-camera
            name: Free camera
            components:
              - {type: FreeCamera}
      - id: light
        name: Light
        transform: {type: Transform3D, rotationX: 33, rotationY: -21.8}
        components:
          - {type: Light, ambient: 0.3}
      - id: cube-field
        name: Cube field
        transform: {type: Transform3D, z: 10}
        components:
          - {type: CubeField, cubeCount: 16}
      - id: shapes
        name: Shapes
        transform: {type: Transform3D, y: -2.2, z: 6}
        children:
          - id: floor
            name: Floor
            transform: {type: Transform3D, scaleX: 6, scaleZ: 3}
            components:
              - type: MeshRenderer
                mesh:
                  type: PlaneMesh
                  material:
                    type: StandardMaterial3D
                    albedoColor: {r: 90, g: 90, b: 110, a: 255}
                  sizeX: 1
                  sizeZ: 1
                  subdivideDepth: 15
                  subdivideWidth: 15
          - id: pyramid
            name: Pyramid
            transform: {type: Transform3D, x: -1.5, y: 0.5}
            components:
              - type: MeshRenderer
                mesh:
                  type: CylinderMesh
                  bottomRadius: 0.7071
                  capTop: false
                  height: 1
                  material:
                    type: StandardMaterial3D
                    albedoColor: {r: 240, g: 200, b: 80, a: 255}
                  radialSegments: 4
                  rings: 0
                  topRadius: 0
          - id: ball
            name: Ball
            transform: {type: Transform3D, x: 1.5, y: 0.5}
            components:
              - type: MeshRenderer
                mesh:
                  type: SphereMesh
                  material:
                    type: StandardMaterial3D
                    albedoColor: {r: 80, g: 160, b: 240, a: 255}
                  radialSegments: 16
                  rings: 8
          - id: box
            name: Box
            transform: {type: Transform3D, rotationY: 25, x: -4.5, y: 0.5, z: 0}
            components:
              - type: MeshRenderer
                mesh:
                  type: BoxMesh
                  material:
                    type: StandardMaterial3D
                    albedoColor: {r: 255, g: 255, b: 255, a: 255}
                    albedoTexture: {root: game, path: sprite.png}
          - id: cylinder
            name: Cylinder
            transform: {type: Transform3D, x: -3, y: 0.5, z: 2.5}
            components:
              - type: MeshRenderer
                mesh:
                  type: CylinderMesh
                  height: 1
                  material:
                    type: StandardMaterial3D
                    albedoColor: {r: 120, g: 220, b: 120, a: 255}
          - id: capsule
            name: Capsule
            transform: {type: Transform3D, x: -1.5, y: 0.5, z: 2.5}
            components:
              - type: MeshRenderer
                mesh:
                  type: CapsuleMesh
                  height: 1.2
                  material:
                    type: StandardMaterial3D
                    albedoColor: {r: 230, g: 90, b: 100, a: 255}
          - id: prism
            name: Prism
            transform: {type: Transform3D, x: 0, y: 0.5, z: 2.5}
            components:
              - type: MeshRenderer
                mesh:
                  type: PrismMesh
                  material:
                    type: StandardMaterial3D
                    albedoColor: {r: 240, g: 160, b: 60, a: 255}
          - id: torus
            name: Torus
            transform: {type: Transform3D, x: 1.5, y: 0.5, z: 2.5}
            components:
              - type: MeshRenderer
                mesh:
                  type: TorusMesh
                  innerRadius: 0.2
                  material:
                    type: StandardMaterial3D
                    albedoColor: {r: 100, g: 230, b: 220, a: 255}
                  outerRadius: 0.5
          - id: hemisphere
            name: Hemisphere
            transform: {type: Transform3D, x: 3, y: 0, z: 2.5}
            components:
              - type: MeshRenderer
                mesh:
                  type: SphereMesh
                  height: 0.5
                  isHemisphere: true
                  material:
                    type: StandardMaterial3D
                    albedoColor: {r: 220, g: 220, b: 220, a: 255}
          - id: crate-obj
            name: Crate OBJ
            transform: {type: Transform3D, rotationY: 20, x: -3, y: 0.5, z: -1}
            components:
              - type: MeshRenderer
                mesh: {root: game, path: models/crate.obj}
          - id: crate-glb
            name: Crate GLB
            transform: {type: Transform3D, rotationY: -20, x: 3, y: 0.5, z: -1}
            components:
              - type: MeshRenderer
                mesh: {root: game, path: models/crate.glb}
          - id: crate-tinted
            name: Crate tinted
            transform: {type: Transform3D, rotationY: -25, x: 4.5, y: 0.5, z: 0}
            components:
              - type: MeshRenderer
                materialOverride:
                  type: StandardMaterial3D
                  albedoColor: {r: 255, g: 120, b: 120, a: 255}
                mesh: {root: game, path: models/crate.obj}
      - id: hint
        name: Hint
        transform: {type: RectTransform, offsetX: 12, offsetY: 12}
        components:
          - type: Label
            color: {r: 220, g: 220, b: 230, a: 255}
            font: {root: engine, path: NunitoSans.ttf, size: 16}
            priority: 1
            text: "Up/Down keys: cubes x2 or /2   WASD, D-pad, J/L/I/K, right mouse, ABXY: camera   F2/R1: next scene"
      - id: controls
        name: Controls
        components:
          - {type: CubeControls, field: cube-field, hint: hint}
