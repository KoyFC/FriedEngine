version: 3
name: Sandbox
camera: camera
objects:
  - id: sandbox-root
    name: Sandbox
    children:
      - id: wall
        name: Wall
        transform: {type: Transform2D, x: -450, y: 160}
        components:
          - type: Box
            borderColor: {r: 150, g: 150, b: 190, a: 255}
            fillColor: {r: 70, g: 70, b: 90, a: 255}
            height: 48
            width: 900
      - id: post-0
        name: Post 0
        transform: {type: Transform2D, x: -600, y: -220}
        components:
          - type: Box
            borderColor: {r: 120, g: 100, b: 80, a: 255}
            fillColor: {r: 58, g: 48, b: 44, a: 255}
            height: 96
            priority: -2
            width: 32
        children:
          - id: post-0-hitbox
            name: Post 0 hitbox
            transform: {type: Transform2D}
            components:
              - type: Collider
                height: 96
                width: 32
      - id: post-1
        name: Post 1
        transform: {type: Transform2D, x: -300, y: -220}
        components:
          - type: Box
            borderColor: {r: 120, g: 100, b: 80, a: 255}
            fillColor: {r: 58, g: 48, b: 44, a: 255}
            height: 96
            priority: -2
            width: 32
        children:
          - id: post-1-hitbox
            name: Post 1 hitbox
            transform: {type: Transform2D}
            components:
              - type: Collider
                height: 96
                width: 32
      - id: post-2
        name: Post 2
        transform: {type: Transform2D, x: 0, y: -220}
        components:
          - type: Box
            borderColor: {r: 120, g: 100, b: 80, a: 255}
            fillColor: {r: 58, g: 48, b: 44, a: 255}
            height: 96
            priority: -2
            width: 32
        children:
          - id: post-2-hitbox
            name: Post 2 hitbox
            transform: {type: Transform2D}
            components:
              - type: Collider
                height: 96
                width: 32
      - id: post-3
        name: Post 3
        transform: {type: Transform2D, x: 300, y: -220}
        components:
          - type: Box
            borderColor: {r: 120, g: 100, b: 80, a: 255}
            fillColor: {r: 58, g: 48, b: 44, a: 255}
            height: 96
            priority: -2
            width: 32
        children:
          - id: post-3-hitbox
            name: Post 3 hitbox
            transform: {type: Transform2D}
            components:
              - type: Collider
                height: 96
                width: 32
      - id: post-4
        name: Post 4
        transform: {type: Transform2D, x: 600, y: -220}
        components:
          - type: Box
            borderColor: {r: 120, g: 100, b: 80, a: 255}
            fillColor: {r: 58, g: 48, b: 44, a: 255}
            height: 96
            priority: -2
            width: 32
        children:
          - id: post-4-hitbox
            name: Post 4 hitbox
            transform: {type: Transform2D}
            components:
              - type: Collider
                height: 96
                width: 32
      - id: player
        name: Player
        instance: player
        transform: {x: -64, y: -64}
        components:
          - type: Player
            wall: wall
      - id: camera
        name: Camera
        transform: {type: Transform2D, x: 0, y: 0}
        components:
          - type: Camera
            zoom: 1
        children:
          - id: camera-follow
            name: Camera follow
            components:
              - type: CameraFollow
                offsetX: 64
                offsetY: 64
                target: player
      - id: hud
        name: Interface
        instance: sandbox_ui
      - id: world
        name: World
        components:
          - type: SandboxWorld
            camera: camera
            hud: hud
            player: player
