version: 3
name: Sandbox Physics
camera: camera
objects:
  - id: physics-root
    name: Physics
    children:
      - id: camera
        name: Camera
        transform: {type: Transform2D}
        components:
          - {type: Camera, zoom: 1}
      - id: ground
        name: Ground
        transform: {type: Transform2D, y: 200}
        components:
          - {type: BoxShape2D, height: 40, isDebugVisible: true, width: 640}
      - id: crate
        name: Crate
        transform: {type: Transform2D, x: -40, y: -160, scaleX: 2, scaleY: 2}
        components:
          - {type: RigidBody2D}
          - {type: SpriteRenderer, texture: {root: game, path: sprite.png}}
          - {type: BoxShape2D, height: 16, isDebugVisible: true, restitution: 0.3, width: 16}
      - id: ball
        name: Ball
        transform: {type: Transform2D, x: 30, y: -240, scaleX: 2, scaleY: 2}
        components:
          - {type: RigidBody2D}
          - {type: SpriteRenderer, texture: {root: game, path: sprite.png}}
          - {type: CircleShape2D, isDebugVisible: true, radius: 8, restitution: 0.6}
      - id: zone
        name: Zone
        transform: {type: Transform2D, x: 0, y: 150}
        components:
          - {type: BoxShape2D, height: 30, isDebugVisible: true, isSensor: true, width: 200}
      - id: demo
        name: Demo
        components:
          - {type: PhysicsDemo, crate: crate, zone: zone}
