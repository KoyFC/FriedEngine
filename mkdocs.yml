site_name: Fried Engine
site_url: https://koyfc.github.io/FriedEngine/
site_description: A game engine in Haxe, compiled to C++ through hxcpp, built with CMake for PC, consoles, a calculator and the web.
repo_url: https://github.com/KoyFC/FriedEngine
repo_name: KoyFC/FriedEngine
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/tools.md
      - getting-started/installing.md
      - getting-started/building.md
      - getting-started/using-in-a-game.md
      - getting-started/vscode.md
      - getting-started/troubleshooting.md
  - Architecture:
      - architecture/index.md
      - architecture/consuming.md
      - architecture/native-layer.md
      - architecture/ownership.md
      - architecture/input.md
      - architecture/nodes.md
      - architecture/draw-queue.md
      - architecture/text.md
      - architecture/cameras.md
      - architecture/layers.md
      - architecture/scene-switching.md
      - architecture/scene-files.md
      - architecture/starting-a-game.md
      - architecture/editor-player.md
      - architecture/3d.md
      - architecture/collisions.md
      - architecture/asset-roots.md
      - architecture/project-file.md
  - Platforms:
      - platforms/index.md
      - platforms/windows.md
      - platforms/vita.md
      - platforms/switch.md
      - platforms/3ds.md
      - platforms/nds.md
      - platforms/cg50.md
      - platforms/web.md
  - Reference:
      - reference/project-file.md
  - API reference: https://koyfc.github.io/FriedEngine/api/
  - Development:
      - development/index.md
      - development/3d-roadmap.md
      - development/editor-roadmap.md
